[project]
name = "paper-reproducer"
version = "0.1.0"
description = "Headless SwarmFlow runner for reproducer_flow.py"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Exact engine build that JiuwenSwarm's uv.lock resolves (openjiuwen 0.1.19).
    # Engine signatures change between revisions; bump only together with JiuwenSwarm.
    "openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@07b9632391c060e3bdff656d1c653719d9d1fe97",
    # Same cap as JiuwenSwarm: filelock>=4.0.2 strands openjiuwen's FS locks.
    "filelock>=3.25.0,<4",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "pypdfium2>=4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
